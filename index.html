<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard projet — Reims Habitat</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#ffffff;
  --text:#1f1f1f;
  --muted:#71767b;
  --line:#e5e7e8;
  --lime:#b6d400;
  --lime-soft:#f3f7d7;
  --soft:#f5f6f7;
  --shadow:0 6px 18px rgba(0,0,0,.05);
}

*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Montserrat','Avenir Next',Arial,sans-serif;
}
body{overflow-x:hidden}

.wrap{width:100%;padding:0}
.panel{
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px;
  background:#fff;
  box-shadow:var(--shadow);
}
.title{
  font-size:13px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.03em;
  margin-bottom:14px;
  padding-left:10px;
  position:relative;
}
.title:before{
  content:"";
  position:absolute;
  left:0;
  top:1px;
  bottom:1px;
  width:4px;
  background:var(--lime);
  border-radius:6px;
}

.layout{
  display:grid;
  grid-template-columns:180px 1fr;
  gap:14px;
  align-items:stretch;
}

.chart-box{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:224px;
}

.ring{
  --p:68;
  width:150px;
  aspect-ratio:1;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:conic-gradient(var(--lime) calc(var(--p)*1%), #eceff1 0);
  position:relative;
  cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease;
}
.ring:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 18px rgba(0,0,0,.08);
}
.ring:after{
  content:"";
  position:absolute;
  inset:16px;
  border-radius:50%;
  background:#fff;
}
.ringin{
  position:relative;
  z-index:2;
  text-align:center;
}
.ring strong{
  display:block;
  font-size:34px;
  line-height:1;
}
.ring span{
  display:block;
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
  font-weight:600;
}

.kpis{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  min-height:224px;
}
.kpi{
  border:1px solid var(--line);
  border-radius:9px;
  padding:14px;
  background:var(--soft);
  min-height:107px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  justify-content:center;
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.kpi:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 18px rgba(0,0,0,.06);
  border-color:#d6dadd;
}
.kpi.active{
  border-color:var(--lime);
  box-shadow:0 0 0 2px rgba(182,212,0,.15);
}
.kpi.lime{background:var(--lime-soft)}

.label{
  font-size:9px;
  color:var(--muted);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.07em;
}
.value{
  font-size:27px;
  font-weight:800;
  line-height:1;
  margin-top:10px;
  letter-spacing:-.03em;
}
.value.small{
  font-size:17px;
  line-height:1.2;
}
.foot{
  margin-top:8px;
  font-size:10px;
  color:var(--muted);
  font-weight:500;
}

@media(max-width:620px){
  .layout{grid-template-columns:1fr}
  .chart-box{min-height:170px}
}
@media(max-width:420px){
  .kpis{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="panel">
    <div class="title">Vue d’ensemble</div>

    <div class="layout">
      <div class="chart-box">
        <div class="ring" id="ringAction" role="button" tabindex="0" aria-label="Avancement global du projet">
          <div class="ringin">
            <strong>68%</strong>
            <span>du projet</span>
          </div>
        </div>
      </div>

      <div class="kpis">
        <div class="kpi active" data-key="tasks">
          <div class="label">Tâches ouvertes</div>
          <div class="value">12</div>
          <div class="foot">sur 37 tâches</div>
        </div>

        <div class="kpi lime" data-key="milestone">
          <div class="label">Prochain jalon</div>
          <div class="value small">COPIL phase 2</div>
          <div class="foot">14 octobre 2026</div>
        </div>

        <div class="kpi" data-key="budget">
          <div class="label">Budget suivi</div>
          <div class="value">3,2 M€</div>
          <div class="foot">sur 4,5 M€</div>
        </div>

        <div class="kpi" data-key="meetings">
          <div class="label">Réunions à venir</div>
          <div class="value">2</div>
          <div class="foot">dans les 30 prochains jours</div>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
const cards = document.querySelectorAll(".kpi");
cards.forEach(card => {
  card.addEventListener("click", () => {
    cards.forEach(c => c.classList.remove("active"));
    card.classList.add("active");
  });
});
</script>
</body>
</html>
